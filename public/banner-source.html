<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { background: #0b0b0a; }

  body {
    width: 1584px;
    height: 396px;
    background: #0b0b0a;
    font-family: 'Space Grotesk', sans-serif;
    position: relative;
  }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(212,255,58,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212,255,58,0.035) 1px, transparent 1px);
    background-size: 72px 72px;
  }

  .glow {
    position: absolute;
    top: -200px; left: 50%;
    width: 1100px; height: 900px;
    background: radial-gradient(ellipse, rgba(212,255,58,0.09) 0%, transparent 58%);
  }

  .divider {
    position: absolute;
    left: 792px; top: 0; bottom: 0; width: 1px;
    background: linear-gradient(180deg, transparent 0%, rgba(212,255,58,0.16) 25%, rgba(212,255,58,0.16) 75%, transparent 100%);
  }

  .bar-bottom {
    position: absolute;
    bottom: 0; left: 792px; right: 0; height: 2px;
    background: linear-gradient(90deg, #d4ff3a 0%, rgba(212,255,58,0.10) 55%, transparent 100%);
  }

  .brand {
    position: absolute;
    top: 28px; left: 820px;
    display: flex; align-items: center; gap: 10px;
  }
  .bmark {
    position: relative;
    width: 13px; height: 13px;
    background: #d4ff3a;
    flex-shrink: 0;
  }
  .bmark::before {
    content: '';
    position: absolute;
    inset: -5px;
    border: 1px solid #d4ff3a;
  }
  .bname {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(212,255,58,0.28);
    letter-spacing: 0.06em;
  }

  .url {
    position: absolute;
    bottom: 28px; right: 80px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(212,255,58,0.25);
    letter-spacing: 0.1em;
  }

  .safe {
    position: absolute;
    top: 0; left: 792px; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 41px 80px 0;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #d4ff3a;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before {
    content: '';
    width: 22px; height: 1px;
    background: #d4ff3a;
    flex-shrink: 0;
  }

  .headline {
    font-size: 80px;
    font-weight: 700;
    line-height: 0.92;
    letter-spacing: -0.04em;
    color: #f0f0e8;
    margin-bottom: 24px;
  }
  .headline em {
    font-style: normal;
    color: #d4ff3a;
  }

  .tags {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: nowrap;
  }
  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #3e3e38;
    letter-spacing: 0.1em;
    border: 1px solid #1e1e18;
    padding: 5px 10px;
  }
  .tag.hi {
    border-color: rgba(212,255,58,0.3);
    color: rgba(212,255,58,0.65);
  }
  .sep {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #1e1e18;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="divider"></div>
  <div class="bar-bottom"></div>

  <div class="brand">
    <div class="bmark"></div>
    <div class="bname">helloimtom.dev</div>
  </div>

  <div class="url">helloimtom.dev</div>

  <div class="safe">
    <div class="eyebrow">Fullstack Developer · Available for projects</div>
    <div class="headline">From idea<br>to <em>production.</em></div>
    <div class="tags">
      <span class="tag hi">Next.js</span>
      <span class="tag hi">React</span>
      <span class="tag hi">Node.js</span>
      <span class="tag hi">React Native</span>
      <span class="sep">·</span>
      <span class="tag">TypeScript</span>
      <span class="tag">PostgreSQL</span>
      <span class="tag">Docker</span>
    </div>
  </div>
</body>
</html>
